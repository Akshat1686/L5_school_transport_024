name: Complete Static Code Analysis

on:
push:
branches:
- main
- fix/static-analysis

pull_request:
branches:
- main

workflow_dispatch:

permissions:
contents: read

jobs:
analyze:
name: Python Quality and Security Checks
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v6

  - name: Set up Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.12"

  - name: Install analysis tools
    run: |
      python -m pip install --upgrade pip
      python -m pip install pylint bandit flake8

  - name: Run Pylint
    id: pylint
    continue-on-error: true
    run: |
      python -m pylint school_transport.py --fail-under=9.5

  - name: Run Bandit
    id: bandit
    continue-on-error: true
    run: |
      python -m bandit -r school_transport.py \
        -f txt -o bandit_report.txt

  - name: Run Flake8
    id: flake8
    continue-on-error: true
    run: |
      python -m flake8 school_transport.py \
        --output-file=flake8_report.txt

  - name: Upload analysis reports
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: static-analysis-reports
      path: |
        bandit_report.txt
        flake8_report.txt
      if-no-files-found: warn

  - name: Enforce analysis results
    if: always()
    run: |
      if [[ "${{ steps.pylint.outcome }}" != "success" ]]; then
        echo "Pylint failed. Check the job logs."
        exit 1
      fi

      if [[ "${{ steps.bandit.outcome }}" != "success" ]]; then
        echo "Bandit reported findings or encountered an error."
        exit 1
      fi

      if [[ "${{ steps.flake8.outcome }}" != "success" ]]; then
        echo "Flake8 reported style violations."
        exit 1
      fi

      echo "All static analysis checks passed."
```
