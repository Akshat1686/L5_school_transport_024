name: Complete Static Code Analysis

on:
  push:
    branches:
      - main
      - fix/static-analysis
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Python Quality and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint bandit flake8

      - name: Run Pylint (generates pylint_report.txt)
        id: pylint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pylint school_transport.py --fail-under=9.5 > pylint_report.txt 2>&1
          code=$?
          cat pylint_report.txt
          exit $code

      - name: Run Bandit (generates bandit_report.txt)
        id: bandit
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m bandit -r school_transport.py -f txt -o bandit_report.txt
          code=$?
          cat bandit_report.txt
          exit $code

      - name: Run Flake8 (generates flake8_report.txt)
        id: flake8
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m flake8 school_transport.py > flake8_report.txt 2>&1
          code=$?
          cat flake8_report.txt
          exit $code

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            pylint_report.txt
            bandit_report.txt
            flake8_report.txt
          if-no-files-found: warn

      - name: Enforce analysis results
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.pylint.outcome }}" != "success" ]]; then
            echo "Pylint failed or scored below 9.5. See pylint_report.txt in the artifacts."
            exit 1
          fi
          if [[ "${{ steps.bandit.outcome }}" != "success" ]]; then
            echo "Bandit reported findings or encountered an error. See bandit_report.txt in the artifacts."
            exit 1
          fi
          if [[ "${{ steps.flake8.outcome }}" != "success" ]]; then
            echo "Flake8 reported style violations. See flake8_report.txt in the artifacts."
            exit 1
          fi
          echo "All static analysis checks passed."
