name: Pylint Code Analysis

on:
  push:
    branches:
      - main
      - fix/static-analysis
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pylint:
    name: Run Pylint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pylint
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint

      - name: Analyze Python code (generates pylint_report.txt)
        shell: bash
        run: |
          set +e
          python -m pylint school_transport.py --fail-under=9.5 > pylint_report.txt 2>&1
          code=$?
          cat pylint_report.txt
          exit $code

      - name: Upload Pylint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint_report.txt
          if-no-files-found: warn
