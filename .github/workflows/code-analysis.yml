name: Complete Static Code Analysis

on:
  push:
    branches:
      - main
      - fix/static-analysis

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Python Quality and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint bandit flake8

      - name: Run Pylint
        run: |
          python -m pylint school_transport.py \
            --fail-under=9.5 \
            --output-format=text \
            > pylint_report.txt

      - name: Run Bandit
        run: |
          python -m bandit -r school_transport.py \
            -f txt \
            -o bandit_report.txt

      - name: Run Flake8
        run: |
          python -m flake8 school_transport.py \
            --output-file=flake8_report.txt

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            pylint_report.txt
            bandit_report.txt
            flake8_report.txt
          if-no-files-found: warn